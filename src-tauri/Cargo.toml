[package]
name = "gamelapse"
version = "1.0.0"
description = "Open source Windows game time tracker"
authors = ["Furkan YOLAL"]
license = "MIT"
repository = "https://github.com/furkanyolal/gamelapse"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamelapse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
time = { version = "0.3", features = ["formatting"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2"
winreg = "0.56"
keyvalues-parser = "0.2"
ureq = "3"
tempfile = "3"

# Debug info is off in dev builds to keep `target/` small (full debug info needs several GB on Windows).
# Switch to `debug = "line-tables-only"` once disk space allows, for line numbers in backtraces.
[profile.dev]
debug = 0

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
